    <script>
      // GitHub Pages swaps the whole build. Recover once if a cached page asks
      // for an asset that disappeared during deployment.
      (function () {
        var retryKey = 'clara15-asset-retry';
        function recover() {
          var now = Date.now();
          try {
            if (now - Number(sessionStorage.getItem(retryKey) || 0) < 120000) return;
            sessionStorage.setItem(retryKey, String(now));
          } catch (_) { /* Private browsing may block storage. */ }
          var url = new URL(location.href);
          url.searchParams.set('actualizar', String(now));
          location.replace(url.toString());
        }
        window.addEventListener('error', function (event) {
          var asset = event.target;
          if (!(asset instanceof HTMLScriptElement || asset instanceof HTMLLinkElement)) return;
          var url = asset.src || asset.href || '';
          if (url.startsWith(location.origin + '/clara-15/assets/')) recover();
        }, true);
      })();
    </script>
