name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize Spotify playlist
        env:
          GITHUB_PAGES: 'true'
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
        run: node scripts/sync-spotify.mjs

      - name: Check playlist against the published site
        id: playlist
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          current_hash="$(sha256sum src/data/spotifyTracks.ts | cut -d ' ' -f 1)"
          printf '%s\n' "$current_hash" > "$RUNNER_TEMP/spotify-playlist.sha256"
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status="$(curl --silent --show-error --location --retry 3 --max-time 60 \
            --output "$RUNNER_TEMP/published-playlist.sha256" --write-out '%{http_code}' \
            "https://peniamati.github.io/clara-15/spotify-playlist.sha256?run=$RUN_ID")"
          case "$status" in
            200)
              published_hash="$(tr -d '\r\n' < "$RUNNER_TEMP/published-playlist.sha256")"
              if ! [[ "$published_hash" =~ ^[a-f0-9]{64}$ ]]; then
                echo "::error::The published playlist fingerprint is invalid."
                exit 1
              fi
              if [ "$current_hash" = "$published_hash" ]; then
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "Playlist unchanged; skipping build and deployment."
              else
                echo "publish=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "No published playlist fingerprint yet; initializing it."
              ;;
            *)
              echo "::error::Could not check the published playlist (HTTP $status)."
              exit 1
              ;;
          esac

      - name: Install dependencies
        if: steps.playlist.outputs.publish == 'true'
        run: npm install --legacy-peer-deps

      - name: Build static site
        if: steps.playlist.outputs.publish == 'true'
        env:
          GITHUB_PAGES: 'true'
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID }}
        run: |
          test "$VITE_FIREBASE_PROJECT_ID" = "foton-8d1e5"
          test -n "$VITE_FIREBASE_APP_ID"
          test -n "$VITE_FIREBASE_API_KEY"
          test -n "$VITE_FIREBASE_AUTH_DOMAIN"
          test -n "$VITE_FIREBASE_MESSAGING_SENDER_ID"
          npx vite build
          cp "$RUNNER_TEMP/spotify-playlist.sha256" dist/spotify-playlist.sha256

      - name: Setup Pages
        if: steps.playlist.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.playlist.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: steps.playlist.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
